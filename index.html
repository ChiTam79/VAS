<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>VAS Điều khiển</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Bố cục: thanh trên (kết nối), danh sách file bên trái, cột nút bên phải (tốc độ, Thêm, Xoá), hàng 5 nút điều khiển ở dưới. */
:root{
  --bg:#1a1c1e; --surface:#24272a; --line:#363a3e; --fg:#eef1f3; --muted:#98a2a8;
  --sel-bg:#12908e; --sel-fg:#ffffff; --speed:#ffd21f; --ok:#59d38b; --warn:#ffb74d; --danger:#ff8a80;
  --accent:#4cc3e0; --ring:#e7eaec; --brand:#ee3b2f;
  --c-lui:#1f8fd1; --c-toi:#f0a90f; --c-go:#e8622a; --c-cham:#12a18a; --c-nhanh:#2e9e4d;
  --c-gui:#7a4cd6; --c-them:#2e9e4d; --c-xoa:#e0a010; --ink:#ffffff; --ink-dark:#201600;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --disp:"Barlow Condensed","Barlow",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#e8ebed; --surface:#ffffff; --line:#cdd2d6; --fg:#15191c; --muted:#5b666d;
  --sel-bg:#bfe8e5; --sel-fg:#043f3d; --speed:#a86f00; --ok:#1d7a46; --warn:#9a5b00; --danger:#b3261e;
  --accent:#0b6e8a; --ring:#ffffff; --brand:#d62718; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#e8ebed; --surface:#ffffff; --line:#cdd2d6; --fg:#15191c; --muted:#5b666d;
  --sel-bg:#bfe8e5; --sel-fg:#043f3d; --speed:#a86f00; --ok:#1d7a46; --warn:#9a5b00; --danger:#b3261e;
  --accent:#0b6e8a; --ring:#ffffff; --brand:#d62718; color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
@supports (height:100dvh){html,body{height:100dvh}}
body{background:var(--bg);color:var(--fg);font:16px/1.35 var(--sans);overflow-x:hidden;
  padding-block:8px 6px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px;min-height:0}
.bar{display:flex;align-items:center;gap:10px;min-height:48px}
.title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.1}
.title b{font:700 52px/1 var(--disp);letter-spacing:.04em;color:var(--brand)}
.title span{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title span.on{color:var(--ok)}
.chip{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line)}
.chip svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chip.bt{background:#1b6fd1;border-color:var(--ring);color:#fff}
.chip.bt.on{background:#1e8f4e}
.chip.bt.busy{background:#1b6fd1;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
#msg{margin:0;min-height:20px;font-size:14px;color:var(--muted)}
#msg.err{color:var(--danger)} #msg.ok{color:var(--ok)}
.prog{position:relative;height:22px;border-radius:11px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.prog i{position:absolute;inset:0 auto 0 0;width:0;background:var(--c-gui);transition:width .15s}
.prog span{position:relative;display:block;text-align:center;font:600 13px/20px var(--sans);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.main{flex:1;min-height:0;display:flex;gap:8px}
.list{flex:1;min-width:0;margin:0;padding:0;list-style:none;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.list li{margin:0}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:6px 12px;text-align:left;font-size:19px;border-bottom:1px solid var(--line)}
.row .n{flex:none;font:500 13px/1 var(--disp);letter-spacing:.06em;color:var(--muted);width:22px}
.row .t{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row.sel{background:var(--sel-bg);color:var(--sel-fg);font-weight:700}
.row.sel .n{color:inherit;opacity:.8}
.row.sel.playing .t{text-overflow:clip}
.row.sel.playing .t>span{display:inline-block;padding-left:100%;animation:mq var(--d,10s) linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
.empty{padding:18px 14px;color:var(--muted);font-size:15px}
.side{flex:none;width:68px;display:flex;flex-direction:column;align-items:center;gap:10px}
.speed{width:100%;text-align:center;line-height:1}
.speed small{display:block;font:600 11px var(--disp);letter-spacing:.14em;color:var(--muted)}
.speed b{display:block;font:700 56px/1 var(--disp);color:var(--speed)}
.cb{display:flex;flex-direction:column;align-items:center;gap:3px;font:600 11px var(--disp);letter-spacing:.1em;color:var(--muted)}
.rb{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--ring);box-shadow:0 2px 6px rgba(0,0,0,.35);color:var(--ink);background:var(--bgc)}
.rb svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.rb svg .f{fill:currentColor;stroke:none}
.cb:active:not(:disabled) .rb{transform:scale(.93)}
.cb:disabled{opacity:.4}
.cb.armed .rb{background:#c62828;color:#fff}
.cb.armed{color:var(--danger)}
.side .spacer{flex:1}
.foot{display:flex;justify-content:space-between;gap:8px;font:13px var(--sans);color:var(--muted);min-height:18px}
.foot .ok{color:var(--ok)} .foot .warn{color:var(--warn)} .foot .over{color:var(--danger)}
.pad{display:flex;justify-content:space-between;align-items:flex-end;gap:4px;padding-bottom:2px}
.pad .rb{width:min(58px,14.5vw);height:min(58px,14.5vw)}
.pad .big .rb{width:min(78px,19vw);height:min(78px,19vw)}
.pad .big .rb svg{width:50%;height:50%}
.sheet{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .box{width:100%;max-width:520px;max-height:88%;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 6px;font:700 20px var(--disp);letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}
.sheet label{display:flex;flex-direction:column;gap:4px;margin-top:10px;font-size:13px;color:var(--muted)}
.sheet input{font:15px ui-monospace,Menlo,Consolas,monospace;min-height:42px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:0 10px;width:100%}
.sheet p{margin:10px 0 0;font-size:13px;color:var(--muted)}
.sheet pre{margin:10px 0 0;max-height:200px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.close{min-width:44px;min-height:44px;font-size:15px;color:var(--accent)}
@media (max-height:760px){.speed b{font-size:44px}}
@media (max-height:640px){.side{gap:6px}.side .rb{width:46px;height:46px}.side .rb svg{width:24px;height:24px}.speed b{font-size:38px}.cb{font-size:10px}}
@media (max-height:620px){.pad .big .rb{width:min(66px,17vw);height:min(66px,17vw)}}
@media (prefers-reduced-motion:reduce){.row.sel.playing .t>span{animation:none;padding-left:0}.row.sel.playing .t{text-overflow:ellipsis}.chip.bt.busy{animation:none}.prog i{transition:none}}
</style>

<div class="app">
  <header class="bar">
    <div class="title"><b>VAS</b><span id="connText">Không kết nối</span></div>
    <button class="chip" id="btnSet" type="button" aria-label="Cài đặt"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
    <button class="chip bt" id="btnConn" type="button" aria-label="Kết nối Bluetooth"><svg viewBox="0 0 24 24"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></svg></button>
  </header>
  <p id="msg" aria-live="polite"></p>
  <div class="prog" id="prog" hidden><i id="progFill"></i><span id="progText"></span></div>

  <div class="main">
    <ol class="list" id="list" aria-label="Danh sách file"></ol>
    <aside class="side">
      <div class="speed"><small>TỐC ĐỘ</small><b id="speed">–</b></div>
      <div class="spacer"></div>
      <button class="cb" id="btnAdd" type="button" disabled style="--bgc:var(--c-them)"><span class="rb"><svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7zM14 3v4h4M12 11v6M9 14h6"/></svg></span>THÊM BÀI</button>
      <button class="cb" id="btnDel" type="button" disabled style="--bgc:var(--c-xoa);--ink:var(--ink-dark)"><span class="rb"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg></span><span id="delLbl">XOÁ</span></button>
    </aside>
  </div>
  <input id="fileIn" type="file" accept=".txt,text/plain" multiple hidden>

  <div class="foot"><span id="capLeft"></span><span id="sync"></span></div>

  <nav class="pad" aria-label="Phím điều khiển">
    <button class="cb" id="kLui" type="button" disabled style="--bgc:var(--c-lui)"><span class="rb"><svg viewBox="0 0 24 24"><path class="f" d="M19 5v14L9 12z"/><path d="M6 5v14"/></svg></span>LÙI</button>
    <button class="cb" id="kToi" type="button" disabled style="--bgc:var(--c-toi);--ink:var(--ink-dark)"><span class="rb"><svg viewBox="0 0 24 24"><path class="f" d="M5 5v14l10-7z"/><path d="M18 5v14"/></svg></span>TỚI</button>
    <button class="cb big" id="kSS" type="button" disabled style="--bgc:var(--c-go)"><span class="rb"><svg id="ssIcon" viewBox="0 0 24 24"><path class="f" d="M8 5v14l11-7z"/></svg></span><span id="ssLbl">START</span></button>
    <button class="cb" id="kGiam" type="button" disabled style="--bgc:var(--c-cham)"><span class="rb"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></span>CHẬM</button>
    <button class="cb" id="kTang" type="button" disabled style="--bgc:var(--c-nhanh)"><span class="rb"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></span>NHANH</button>
  </nav>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-label="Cài đặt">
    <h2>Cài đặt BLE <button class="close" id="btnClose" type="button">Đóng</button></h2>
    <label for="uuidSvc">UUID service (để trống để tự tìm)
      <input id="uuidSvc" placeholder="FFE0 hoặc 6e400001-b5a3-f393-e0a9-e50e24dcca9e" autocomplete="off" spellcheck="false"></label>
    <label for="uuidRx">UUID nhận dữ liệu từ mạch (notify)
      <input id="uuidRx" placeholder="FFE1" autocomplete="off" spellcheck="false"></label>
    <label for="uuidTx">UUID gửi dữ liệu xuống mạch (write)
      <input id="uuidTx" placeholder="FFE1" autocomplete="off" spellcheck="false"></label>
    <label for="chunk">Số byte mỗi gói BLE
      <input id="chunk" inputmode="numeric" value="20" autocomplete="off"></label>
    <p>Nếu app không tìm thấy kênh dữ liệu, mở nRF Connect để xem UUID của module, nhập vào đây rồi kết nối lại. Số byte mỗi gói để 20 là an toàn nhất.</p>
    <pre id="log" aria-label="Nhật ký"></pre>
  </div>
</div>

<script id="core">

/* ===== Phần lõi (không dùng DOM): hằng số, đọc file txt, tạo image, khung UART, giao thức ===== */
const PAGE = 256, MAX_FILES = 60, MAX_DELAY = 32767, NAME_LEN = 16, ADD_CHUNK = 64;
const CMD = { PING: 1, BEGIN: 2, PAGE: 3, END: 4, KEY: 5, STATUS: 6, SELECT: 7, INFO: 8, NAMES: 9, DELETE: 10, ADD_BEGIN: 11, ADD_DATA: 12, ADD_END: 13 };
const KEY = { TOI: 0, LUI: 1, TANG: 2, GIAM: 3, SS: 4 };
const STATUS_TEXT = { 0: "OK", 1: "sai trình tự lệnh", 2: "tham số sai", 3: "lỗi ghi/xóa flash",
  4: "header dữ liệu không hợp lệ", 5: "còn thiếu dữ liệu", 6: "sai CRC", 7: "lệnh không biết", 8: "hết chỗ (60 file hoặc đầy bộ nhớ)" };

/* Tên file lưu trên mạch: bỏ đuôi .txt, tối đa 16 byte UTF-8 (cắt ở ranh giới ký tự) */
function nameBytes(fileName) {
  const text = fileName.replace(/\.txt$/i, "").trim() || "file";
  const out = new Uint8Array(NAME_LEN);
  let n = 0;
  for (const ch of text) {
    const b = new TextEncoder().encode(ch);
    if (n + b.length > NAME_LEN) break;
    out.set(b, n); n += b.length;
  }
  return out;
}
function nameText(b16) {
  let n = 0; while (n < b16.length && b16[n] !== 0 && b16[n] !== 0xFF) n++;
  return new TextDecoder("utf-8").decode(b16.subarray(0, n));
}

function crc16(b, crc) {
  crc = crc === undefined ? 0xFFFF : crc;
  for (let i = 0; i < b.length; i++) {
    crc ^= b[i];
    for (let k = 0; k < 8; k++) crc = (crc & 1) ? ((crc >>> 1) ^ 0xA001) : (crc >>> 1);
  }
  return crc & 0xFFFF;
}

function decodeText(buf) {
  if (buf.length >= 2 && buf[0] === 0xFF && buf[1] === 0xFE) return new TextDecoder("utf-16le").decode(buf.subarray(2));
  if (buf.length >= 2 && buf[0] === 0xFE && buf[1] === 0xFF) return new TextDecoder("utf-16be").decode(buf.subarray(2));
  try { return new TextDecoder("utf-8", { fatal: true }).decode(buf).replace(/^﻿/, ""); }
  catch (e) { return new TextDecoder("windows-1252").decode(buf); }
}

/* Dòng 1 = tổng số dòng dữ liệu. Từ dòng 2: cột 1 = thời gian (ms), cột 2 = mức output, các cột sau bỏ qua. */
function parseTxt(name, text) {
  const warnings = [];
  const lines = text.split(/\r\n|\r|\n/);
  let idx = 0;
  while (idx < lines.length && !lines[idx].trim()) idx++;
  if (idx >= lines.length) throw new Error(name + ": file rỗng");
  const first = lines[idx].trim().split(/[\s,;]+/)[0];
  const count = Math.trunc(Number(first));
  if (first === "" || !isFinite(count)) throw new Error(name + ": dòng đầu phải là tổng số dòng dữ liệu");
  if (count < 0) throw new Error(name + ": tổng số dòng không hợp lệ");
  const words = [];
  for (let ln = idx + 1; ln < lines.length; ln++) {
    const t = lines[ln].trim();
    if (!t) continue;
    if (words.length >= count) { warnings.push("Có nhiều dòng hơn số dòng khai báo (" + count + "), phần thừa bị bỏ"); break; }
    const tok = t.split(/[\s,;]+/).filter(Boolean);
    if (tok.length < 2) throw new Error(name + " dòng " + (ln + 1) + ": cần ít nhất 2 cột (thời gian, mức output)");
    const d = Number(tok[0]), l = Number(tok[1]);
    if (!isFinite(d) || !isFinite(l)) throw new Error(name + " dòng " + (ln + 1) + ": giá trị không phải số");
    const delay = Math.round(d);
    if (delay < 0 || delay > MAX_DELAY) throw new Error(name + " dòng " + (ln + 1) + ": thời gian " + delay + " ms ngoài khoảng 0.." + MAX_DELAY);
    words.push(((Math.trunc(l) !== 0 ? 1 : 0) << 15) | delay);
  }
  if (words.length < count) warnings.push("Khai báo " + count + " dòng nhưng chỉ có " + words.length + " dòng dữ liệu");
  let ms = 0;
  for (const w of words) ms += w & 0x7FFF;
  return { words: Uint16Array.from(words), warnings: warnings, ms: ms };
}

function makeFrame(cmd, payload) {
  payload = payload || new Uint8Array(0);
  const f = new Uint8Array(2 + 3 + payload.length + 2);
  f[0] = 0xA5; f[1] = 0x5A; f[2] = cmd; f[3] = payload.length & 255; f[4] = payload.length >> 8;
  f.set(payload, 5);
  const c = crc16(f.subarray(2, 5 + payload.length));
  f[5 + payload.length] = c & 255; f[6 + payload.length] = c >> 8;
  return f;
}

function unpackStatus(extra) { return { file: extra & 63, level: (extra >> 6) & 15, mode: (extra >> 10) & 3 }; }

/* Phản hồi của mạch: ngắn  A5 5A | status | cmd | extra(2) | crc(2)
 *                     dài   A5 5C | status | cmd | len(2) | payload | crc(2) */
class FrameParser {
  constructor() { this.buf = []; }
  push(bytes) {
    for (const b of bytes) this.buf.push(b);
    const out = [], B = this.buf;
    for (;;) {
      let i = 0;
      while (i + 1 < B.length && !(B[i] === 0xA5 && (B[i + 1] === 0x5A || B[i + 1] === 0x5C))) i++;
      if (i > 0) B.splice(0, i);
      if (B.length < 8) break;
      if (B[1] === 0x5A) {
        if (crc16(B.slice(2, 6)) === (B[6] | (B[7] << 8))) {
          out.push({ status: B[2], cmd: B[3], extra: B[4] | (B[5] << 8), payload: null });
          B.splice(0, 8);
        } else B.splice(0, 1);
      } else {
        const len = B[4] | (B[5] << 8);
        if (len > 80) { B.splice(0, 1); continue; }
        if (B.length < 8 + len) break;
        if (crc16(B.slice(2, 6 + len)) === (B[6 + len] | (B[7 + len] << 8))) {
          out.push({ status: B[2], cmd: B[3], extra: len, payload: Uint8Array.from(B.slice(6, 6 + len)) });
          B.splice(0, 8 + len);
        } else B.splice(0, 1);
      }
    }
    return out;
  }
}

class LinkError extends Error {}

const u16 = (p, o) => p[o] | (p[o + 1] << 8);

class Link {
  /* write(bytes) là hàm async do tầng BLE cung cấp (tự chia gói và giãn nhịp cho UART 9600) */
  constructor(write) {
    this.write = write; this.parser = new FrameParser(); this.waiter = null;
    this.q = Promise.resolve(); this.pending = 0; this.onStatus = null;
  }
  onBytes(bytes) { for (const f of this.parser.push(bytes)) this._frame(f); }
  _frame(f) {
    if (f.cmd === CMD.KEY || f.cmd === CMD.STATUS || f.cmd === CMD.SELECT) { if (this.onStatus) this.onStatus(unpackStatus(f.extra), f); }
    const w = this.waiter;
    if (w && f.cmd === w.cmd && (!w.accept || f.status !== 0 || w.accept(f))) {
      w.settled = true; clearTimeout(w.timer); this.waiter = null; w.res(f);
    }
  }
  _lock(fn) {
    this.pending++;
    const run = this.q.then(() => fn());
    this.q = run.then(() => { this.pending--; }, () => { this.pending--; });
    return run;
  }
  request(cmd, payload, o) {
    o = o || {};
    const retries = o.retries === undefined ? 2 : o.retries, timeout = o.timeout || 2500;
    return this._lock(async () => {
      const frame = makeFrame(cmd, payload);
      let last = "";
      for (let a = 0; a <= retries; a++) {
        const w = { cmd: cmd, accept: o.accept, settled: false, timer: null };
        w.promise = new Promise((res, rej) => { w.res = res; w.rej = rej; });
        this.waiter = w;
        try { await this.write(frame); }
        catch (e) { this.waiter = null; throw new LinkError("Không gửi được dữ liệu: " + e.message); }
        if (!w.settled) w.timer = setTimeout(() => { if (this.waiter === w) this.waiter = null; w.rej(new Error("timeout")); }, timeout);
        let r;
        try { r = await w.promise; } catch (e) { last = "không có phản hồi"; continue; }
        if (r.status === 6) { last = "mạch nhận sai CRC"; continue; }
        if (r.status === 1 && a > 0 && o.okIfStateOnRetry) return { status: 0, cmd: r.cmd, extra: r.extra, payload: null, retried: true };
        if (r.status !== 0 && !o.allowStatus) {
          const e = new LinkError("Mạch báo lỗi: " + (STATUS_TEXT[r.status] || "?") + " (mã " + r.status + ", tham số " + r.extra + ")");
          e.status = r.status; e.extra = r.extra; throw e;
        }
        return r;
      }
      const e = new LinkError("Không liên lạc được với mạch (" + last + "). Kiểm tra dây PA5/PB1, nguồn và module BLE (9600).");
      e.timeout = true; throw e;
    });
  }
  /* phím từ xa; drop = true: bỏ qua nếu đang bận (dùng cho tự lặp) */
  key(k, drop) {
    if (drop && this.pending > 0) return Promise.resolve(null);
    return this.request(CMD.KEY, Uint8Array.of(k), { retries: 0, timeout: 900, allowStatus: true }).catch(() => null);
  }
  /* chọn thẳng file số n (1..N) trên mạch */
  select(n) { return this.request(CMD.SELECT, Uint8Array.of(n), { retries: 1, timeout: 1200, allowStatus: true }).catch(() => null); }
  status() { return this.request(CMD.STATUS, null, { retries: 1, timeout: 1200, allowStatus: true }); }

  /* INFO: số file, mã nhận dạng danh sách (sig), số trang đang dùng, số trang tối đa */
  async info() {
    const r = await this.request(CMD.INFO, null, { timeout: 2500 });
    const p = r.payload;
    if (!p || p.length < 8) throw new LinkError("Mạch trả lời INFO sai độ dài");
    return { nfiles: u16(p, 0), sig: u16(p, 2), pages: u16(p, 4), cap: u16(p, 6) };
  }
  /* NAMES: chỉ khi mạch đang dừng. Trả về [{name, lines}] */
  async names(first, count) {
    const r = await this.request(CMD.NAMES, Uint8Array.of(first, count), { timeout: 3000 });
    const p = r.payload, out = [];
    if (!p || p.length !== count * (NAME_LEN + 2)) throw new LinkError("Mạch trả lời NAMES sai độ dài");
    for (let k = 0; k < count; k++) {
      const o = k * (NAME_LEN + 2);
      out.push({ name: nameText(p.subarray(o, o + NAME_LEN)), lines: u16(p, o + NAME_LEN) });
    }
    return out;
  }
  async syncNames(nfiles, progress) {
    const all = [];
    for (let first = 0; first < nfiles; first += 4) {
      const c = Math.min(4, nfiles - first);
      for (const x of await this.names(first, c)) all.push(x);
      if (progress) progress(all.length, nfiles);
    }
    return all;
  }
  /* Xoá file k (1..N). Không tự gửi lại: nếu mất phản hồi thì hỏi INFO và so mã nhận dạng. Trả về sig mới. */
  async del(k, sigBefore) {
    try {
      const r = await this.request(CMD.DELETE, Uint8Array.of(k), { retries: 0, timeout: 8000 });
      return r.extra;
    } catch (e) {
      if (!e.timeout) throw e;
      let inf;
      try { inf = await this.info(); } catch (x) { throw e; }
      if (sigBefore !== undefined && inf.sig !== sigBefore) return inf.sig;
      throw new LinkError("Mạch không phản hồi lệnh xoá và danh sách chưa đổi.");
    }
  }
  /* Thêm một file: name = Uint8Array(16), words = Uint16Array. Trả về INFO mới. */
  async addFile(name, words, o) {
    o = o || {};
    const progress = o.progress || function () {};
    const n = words.length;
    if (n < 1) throw new LinkError("File không có dòng dữ liệu nào");
    if (n > 0xFFFF) throw new LinkError("File quá dài");
    const p0 = new Uint8Array(2 + NAME_LEN);
    p0[0] = n & 255; p0[1] = n >> 8; p0.set(name, 2);
    await this.request(CMD.ADD_BEGIN, p0, { timeout: 4000, okIfStateOnRetry: true });
    for (let off = 0; off < n; off += ADD_CHUNK) {
      const c = Math.min(ADD_CHUNK, n - off);
      const p = new Uint8Array(2 + 2 * c);
      p[0] = off & 255; p[1] = off >> 8;
      for (let k = 0; k < c; k++) { p[2 + 2 * k] = words[off + k] & 255; p[3 + 2 * k] = words[off + k] >> 8; }
      await this.request(CMD.ADD_DATA, p, { timeout: 3500, accept: f => f.extra === off + c });
      progress(off + c, n);
    }
    await this.request(CMD.ADD_END, null, { timeout: 8000, okIfStateOnRetry: true });
    return this.info();
  }
}

</script>

<script id="ui">
/* ===== Giao diện, BLE, lưu danh sách file ===== */
const $ = id => document.getElementById(id);
const KNOWN_SERVICES = [0xFFE0, 0xFFE5, 0xFFF0, 0xFFB0, 0xFFC0, 0xFFD0, 0xFF00, 0xAE00, 0xAF30, 0xABF0, 0xFEE0, 0xFEE7, 0x18F0,
  "6e400001-b5a3-f393-e0a9-e50e24dcca9e", "49535343-fe7d-4ae5-8fa9-9fafd205e455", "0000ffe0-0000-1000-8000-00805f9b34fb"];
const PREFERRED = ["0000ffe0", "6e400001", "0000fff0", "49535343"];

const S = { dev: null, link: null, rx: null, tx: null, connected: false, connecting: false, sending: false,
  files: [], sig: null, pages: 0, cap: 144, verified: false, mode: -1, level: 0, fileNo: 0, needSync: false, syncing: false,
  wake: null, armTimer: null };
const sleep = ms => new Promise(r => setTimeout(r, ms));

function log(t) {
  const el = $("log"), d = new Date(), p = n => String(n).padStart(2, "0");
  el.textContent += "[" + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds()) + "] " + t + "\n";
  const lines = el.textContent.split("\n"); if (lines.length > 220) el.textContent = lines.slice(-200).join("\n");
  el.scrollTop = el.scrollHeight;
}
function setMsg(t, kind) { const m = $("msg"); m.textContent = t || ""; m.className = kind || ""; }
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} return null; }

/* ---------- Lưu danh sách tên file trên điện thoại (IndexedDB) ---------- */
function idb() { return new Promise((res, rej) => { const r = indexedDB.open("cx33", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function kvGet(k) {
  try { const db = await idb(); return await new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
  catch (e) { return undefined; }
}
async function kvSet(k, v) {
  try { const db = await idb(); await new Promise((res, rej) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
  catch (e) { log("Không lưu được danh sách vào trình duyệt."); }
}
/* bản lưu: mã nhận dạng (sig) của mạch + tên + số dòng từng file */
const saveList = () => kvSet("list", { sig: S.sig, pages: S.pages, cap: S.cap, files: S.files.map(f => ({ name: f.name, lines: f.lines })) });

/* ---------- Vẽ giao diện ---------- */
function renderList() {
  const ol = $("list");
  ol.innerHTML = "";
  if (!S.files.length) {
    const li = document.createElement("li"); li.className = "empty";
    li.textContent = S.connected ? "Mạch chưa có file nào. Bấm “THÊM BÀI” để chọn file txt từ điện thoại, hoặc nạp bằng phần mềm trên máy tính qua USB."
                                 : "Chưa có danh sách. Bấm nút Bluetooth để kết nối với mạch; tên file sẽ được đồng bộ về điện thoại.";
    ol.appendChild(li); return;
  }
  const playing = S.mode === 2 && S.connected;
  S.files.forEach((f, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button"; b.className = "row"; b.dataset.no = i + 1;
    const sel = i + 1 === S.fileNo;
    if (sel) { b.classList.add("sel"); b.setAttribute("aria-current", "true"); if (playing) b.classList.add("playing"); }
    const n = document.createElement("span"); n.className = "n"; n.textContent = String(i + 1).padStart(2, "0");
    const t = document.createElement("span"); t.className = "t";
    const inner = document.createElement("span"); inner.textContent = f.name || "(không tên)";
    t.appendChild(inner);
    if (sel && playing) b.style.setProperty("--d", Math.max(7, 5 + f.name.length * 0.28).toFixed(1) + "s");
    b.append(n, t);
    li.appendChild(b); ol.appendChild(li);
  });
  const cur = ol.querySelector(".row.sel"); if (cur && cur.scrollIntoView && !ol.matches(":active")) cur.scrollIntoView({ block: "nearest" });
}
function renderSide() {
  $("speed").textContent = S.connected && S.level >= 1 && S.level <= 8 ? String(S.level) : "–";
}
function renderPad() {
  const can = S.connected && !S.sending && !S.syncing;
  for (const id of ["kLui", "kToi", "kGiam", "kTang", "kSS"]) $(id).disabled = !can;
  const play = S.mode === 2;
  $("ssIcon").innerHTML = play ? '<rect class="f" x="6.5" y="6.5" width="11" height="11" rx="1.5"/>' : '<path class="f" d="M8 5v14l11-7z"/>';
  $("ssLbl").textContent = play ? "STOP" : "START";
}
function renderFoot() {
  $("capLeft").innerHTML = "";
  const l = document.createElement("span");
  l.textContent = S.files.length + " file" + (S.pages ? " · " + S.pages + " / " + S.cap + " trang" : "");
  if (S.pages && S.pages >= S.cap - 1) l.className = "over";
  $("capLeft").appendChild(l);
  const sy = $("sync");
  if (!S.connected) { sy.className = ""; sy.textContent = S.files.length ? "Danh sách đã lưu trên điện thoại" : ""; }
  else if (S.syncing) { sy.className = "warn"; sy.textContent = "Đang đồng bộ tên file…"; }
  else if (S.verified) { sy.className = "ok"; sy.textContent = "Đã đồng bộ với mạch"; }
  else { sy.className = "warn"; sy.textContent = "Chưa đồng bộ"; }
  const idle = S.connected && !S.sending && !S.syncing && S.verified;
  $("btnAdd").disabled = !idle;
  $("btnDel").disabled = !idle || !S.files.length;
  $("btnConn").disabled = S.sending;
  $("btnConn").className = "chip bt" + (S.connected ? " on" : S.connecting ? " busy" : "");
  $("connText").className = S.connected ? "on" : "";
}
function renderAll() { renderList(); renderSide(); renderPad(); renderFoot(); }
function showProg(text, frac) {
  $("prog").hidden = false; $("progFill").style.width = Math.round(frac * 100) + "%"; $("progText").textContent = text;
}
const hideProg = () => { $("prog").hidden = true; };

/* ---------- Đồng bộ tên file: chỉ khi mã nhận dạng của mạch khác bản đã lưu ---------- */
async function refreshList(force) {
  if (!S.link || S.syncing || S.sending) return;
  const link = S.link;
  S.syncing = true; renderAll();
  try {
    let inf;
    try { inf = await link.info(); }
    catch (e) {
      if (e.status === 1) { S.needSync = true; setMsg("Mạch đang bận nhận/xoá file. Sẽ đồng bộ lại khi xong.", ""); return; }
      throw e;
    }
    S.cap = inf.cap; S.pages = inf.pages;
    if (!force && inf.sig === S.sig && inf.nfiles === S.files.length) {
      S.verified = true; S.needSync = false; log("Danh sách không đổi (mã " + inf.sig + "), không cần đồng bộ."); saveList(); return;
    }
    if (inf.nfiles === 0) { S.files = []; S.sig = inf.sig; S.verified = true; S.needSync = false; saveList(); return; }
    if (S.mode === 2) {
      S.needSync = true; S.verified = false;
      setMsg("Danh sách trên mạch đã đổi. Dừng file đang phát để đồng bộ tên file.", "");
      return;
    }
    log("Đồng bộ " + inf.nfiles + " tên file…");
    showProg("Đồng bộ tên file…", 0);
    const names = await link.syncNames(inf.nfiles, (n, t) => showProg("Đồng bộ tên file " + n + " / " + t, n / t));
    S.files = names; S.sig = inf.sig; S.verified = true; S.needSync = false;
    saveList();
    setMsg("Đã đồng bộ " + names.length + " tên file.", "ok");
  } catch (e) {
    S.verified = false;
    if (e && e.status === 1) { S.needSync = true; setMsg("Mạch đang bận hoặc đang phát. Dừng phát để đồng bộ.", ""); }
    else setMsg(e.message || String(e), "err");
    log(String((e && e.message) || e));
  } finally {
    S.syncing = false; hideProg(); renderAll();
  }
}

/* ---------- Danh sách: chọn, thêm, xoá ---------- */
$("list").addEventListener("click", async e => {
  const b = e.target.closest(".row"); if (!b || S.sending || S.syncing) return;
  const no = +b.dataset.no;
  if (!S.connected || !S.link || !S.verified) { setMsg("Kết nối và đồng bộ với mạch trước khi chọn file.", "err"); return; }
  S.fileNo = no; renderAll();
  const r = await S.link.select(no);
  if (r && r.status === 1) setMsg(unpackStatus(r.extra).mode === 3 ? "Mạch đang bận nhận/xoá file." : "Mạch chưa có dữ liệu file.", "err");
  else if (r && r.status === 2) { setMsg("Số file không có trên mạch. Đang đồng bộ lại…", "err"); refreshList(true); }
  else if (r) setMsg("");
});
$("btnAdd").addEventListener("click", () => $("fileIn").click());
$("fileIn").addEventListener("change", async e => {
  const picked = Array.from(e.target.files); e.target.value = "";
  if (!picked.length || !S.link || S.sending) return;
  const link = S.link, errs = [], warns = [];
  const jobs = [];
  for (const file of picked) {                       // đọc và kiểm tra hết trước khi gửi
    try {
      const r = parseTxt(file.name, decodeText(new Uint8Array(await file.arrayBuffer())));
      if (r.words.length < 1) throw new Error(file.name + ": không có dòng dữ liệu nào");
      r.warnings.forEach(w => warns.push(file.name + ": " + w));
      jobs.push({ file: file, words: r.words, nb: nameBytes(file.name) });
    } catch (err) { errs.push(err.message); }
  }
  if (!jobs.length) { setMsg(errs.join(" · "), "err"); return; }
  S.sending = true; endAllRepeat(); disarm(); renderAll();
  let done = 0; const t0 = Date.now(); let lastNo = 0;
  try {
    for (let j = 0; j < jobs.length; j++) {
      const job = jobs[j], label = nameText(job.nb);
      if (S.files.length >= MAX_FILES) { errs.push("Đã đủ " + MAX_FILES + " file, bỏ " + job.file.name); continue; }
      setMsg("Đang thêm “" + label + "” (" + (j + 1) + "/" + jobs.length + "). Giữ điện thoại gần mạch, không đóng trang.", "");
      showProg("“" + label + "” 0%", 0);
      try {
        const inf = await link.addFile(job.nb, job.words, { progress: (n, t) => showProg("“" + label + "” " + Math.round(n / t * 100) + "% · " + (j + 1) + "/" + jobs.length, n / t) });
        S.cap = inf.cap; S.pages = inf.pages;
        if (inf.nfiles === S.files.length + 1) { S.files.push({ name: label, lines: job.words.length }); S.sig = inf.sig; lastNo = inf.nfiles; }
        else { S.verified = false; S.needSync = true; }
        done++;
      } catch (err) {
        if (err.status === 8) errs.push("Không đủ chỗ để thêm “" + label + "”");
        else { errs.push(err.message || String(err)); break; }
      }
    }
  } finally {
    S.sending = false; hideProg(); saveList();
  }
  if (!S.verified) { renderAll(); await refreshList(true); }
  if (lastNo && S.verified) { S.fileNo = lastNo; await link.select(lastNo); }
  await link.status().catch(() => null);
  renderAll();
  if (errs.length) setMsg(errs.join(" · "), "err");
  else setMsg("Đã thêm " + done + " file (" + Math.round((Date.now() - t0) / 1000) + " s)." + (warns.length ? " Cảnh báo: " + warns[0] : ""), "ok");
  errs.forEach(log);
});
function disarm() { clearTimeout(S.armTimer); S.armTimer = null; $("btnDel").classList.remove("armed"); $("delLbl").textContent = "XOÁ"; }
$("btnDel").addEventListener("click", async () => {
  if (S.sending || S.syncing || !S.link || !S.files.length) return;
  const i = S.fileNo - 1;
  if (i < 0 || i >= S.files.length) { setMsg("Chạm vào một file trong danh sách để chọn file cần xoá.", "err"); return; }
  if (!S.armTimer) {                                   // lần chạm đầu: hỏi lại
    $("btnDel").classList.add("armed"); $("delLbl").textContent = "XÁC NHẬN";
    setMsg("Chạm XOÁ lần nữa để xoá “" + S.files[i].name + "”.", "err");
    S.armTimer = setTimeout(() => { disarm(); setMsg(""); }, 3500); return;
  }
  disarm();
  const link = S.link, gone = S.files[i];
  S.sending = true; endAllRepeat(); showProg("Đang xoá “" + gone.name + "”…", 0.5); setMsg("Đang xoá, không tắt nguồn mạch.", ""); renderAll();
  let ok = false;
  try {
    const sig = await link.del(i + 1, S.sig);
    S.files.splice(i, 1); S.sig = sig; ok = true;
    if (S.fileNo > S.files.length) S.fileNo = S.files.length;
    saveList();
  } catch (e) {
    setMsg(e.message || String(e), "err"); log(String(e.message || e)); S.verified = false;
  } finally {
    S.sending = false; hideProg(); renderAll();
  }
  if (ok) {
    const inf = await link.info().catch(() => null);
    if (inf) { S.cap = inf.cap; S.pages = inf.pages; if (inf.nfiles !== S.files.length || inf.sig !== S.sig) { await refreshList(true); } else saveList(); }
    await link.status().catch(() => null);
    renderAll();
    setMsg("Đã xoá “" + gone.name + "”.", "ok");
  } else await refreshList(true);
});

/* ---------- BLE ---------- */
function normUuid(s) {
  s = (s || "").trim().toLowerCase().replace(/^0x/, "");
  if (!s) return null;
  if (/^[0-9a-f]{4}$/.test(s) || /^[0-9a-f]{8}$/.test(s)) return parseInt(s, 16);
  if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(s)) return s;
  throw new Error("UUID không hợp lệ: " + s);
}
const full = u => typeof u === "number" ? "0000" + u.toString(16).padStart(4, "0") + "-0000-1000-8000-00805f9b34fb" : u;
const sameUuid = (a, b) => String(a).toLowerCase() === String(b).toLowerCase();
const short = u => /^0000([0-9a-f]{4})-0000-1000-8000-00805f9b34fb$/.test(u) ? u.slice(4, 8).toUpperCase() : u;

async function findChannels(server) {
  const csvc = normUuid(ls("uuidSvc")), crx = normUuid(ls("uuidRx")), ctx = normUuid(ls("uuidTx"));
  const services = await server.getPrimaryServices();
  const found = [];
  for (const s of services) {
    if (/^0000(1800|1801)-/.test(s.uuid)) continue;
    let chars = [];
    try { chars = await s.getCharacteristics(); } catch (e) { continue; }
    log("Service " + short(s.uuid) + ": " + chars.map(c => {
      const p = c.properties, f = [];
      if (p.notify) f.push("notify"); if (p.indicate) f.push("indicate"); if (p.write) f.push("write"); if (p.writeWithoutResponse) f.push("writeNoResp"); if (p.read) f.push("read");
      return short(c.uuid) + "[" + f.join(",") + "]";
    }).join(" "));
    found.push({ s: s, chars: chars });
  }
  if (!found.length) throw new Error("Không thấy service nào. Hãy nhập UUID service của module vào phần Cài đặt rồi kết nối lại.");
  let cand = found;
  if (csvc !== null) cand = found.filter(x => sameUuid(x.s.uuid, full(csvc)));
  cand.sort((a, b) => {
    const pa = PREFERRED.findIndex(p => a.s.uuid.startsWith(p)), pb = PREFERRED.findIndex(p => b.s.uuid.startsWith(p));
    return (pa < 0 ? 99 : pa) - (pb < 0 ? 99 : pb);
  });
  const match = (c, u) => u === null || sameUuid(c.uuid, full(u));
  for (const x of cand) {
    const rxc = x.chars.filter(c => (c.properties.notify || c.properties.indicate) && match(c, crx));
    const txc = x.chars.filter(c => (c.properties.writeWithoutResponse || c.properties.write) && match(c, ctx));
    if (rxc.length && txc.length) {
      const rx = rxc[0];
      return { rx: rx, tx: txc.find(c => c === rx) || txc.find(c => c.properties.writeWithoutResponse) || txc[0] };
    }
  }
  throw new Error("Không tìm thấy kênh nhận (notify) và kênh gửi (write) trong cùng một service. Xem nhật ký trong Cài đặt để biết module có những kênh nào.");
}

const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function noBluetoothMsg() {
  return isIOS ? "Safari và Chrome trên iPhone không hỗ trợ Bluetooth cho trang web. Hãy mở trang này bằng trình duyệt Bluefy (tải miễn phí trên App Store)."
               : "Trình duyệt này không hỗ trợ Bluetooth cho trang web. Hãy mở trang này bằng Chrome trên Android.";
}

function onStatus(st) {
  const prev = S.mode;
  S.mode = st.mode;
  if (st.level >= 1 && st.level <= 8) S.level = st.level;
  if ((st.mode === 1 || st.mode === 2) && st.file > 0) S.fileNo = st.file;
  renderAll();
  if (S.sending || S.syncing || !S.link) return;
  // mạch vừa nhận/xoá/thêm file (có thể do máy tính qua USB): kiểm tra lại mã nhận dạng; hoặc đã dừng phát sau khi bị hoãn đồng bộ
  if ((prev === 3 && st.mode !== 3) || (S.needSync && st.mode === 1)) refreshList(false);
}

async function connect() {
  if (!navigator.bluetooth) { setMsg(noBluetoothMsg(), "err"); return; }
  S.connecting = true; $("connText").textContent = "Đang chọn thiết bị…"; setMsg(""); renderFoot();
  try {
    const extra = [];
    try { const c = normUuid(ls("uuidSvc")); if (c !== null) extra.push(c); } catch (e) { setMsg(e.message, "err"); }
    let dev = S.dev;
    if (!dev) dev = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: KNOWN_SERVICES.concat(extra) });
    S.dev = dev;
    dev.removeEventListener("gattserverdisconnected", onDisc);
    dev.addEventListener("gattserverdisconnected", onDisc);
    $("connText").textContent = "Đang kết nối " + (dev.name || "thiết bị") + "…";
    const server = await dev.gatt.connect();
    const ch = await findChannels(server);
    S.rx = ch.rx; S.tx = ch.tx;
    const size = Math.max(1, Math.min(512, parseInt($("chunk").value, 10) || 20));
    const noResp = !!S.tx.properties.writeWithoutResponse;
    S.link = new Link(async bytes => {
      for (let i = 0; i < bytes.length; i += size) {
        const part = bytes.subarray(i, i + size);
        if (noResp && S.tx.writeValueWithoutResponse) await S.tx.writeValueWithoutResponse(part);
        else await S.tx.writeValue(part);
        await sleep(Math.ceil(part.length * 1.15));      // UART 9600 của module: ~1,04 ms mỗi byte, giãn nhịp để không tràn bộ đệm
      }
    });
    S.link.onStatus = onStatus;
    await S.rx.startNotifications();
    S.rx.addEventListener("characteristicvaluechanged", e => { const v = e.target.value; S.link && S.link.onBytes(new Uint8Array(v.buffer, v.byteOffset, v.byteLength)); });
    S.connected = true; S.connecting = false; S.mode = -1; S.verified = false; S.needSync = false;
    log("Kênh nhận " + short(S.rx.uuid) + ", kênh gửi " + short(S.tx.uuid) + ", gói " + size + " byte" + (noResp ? ", không chờ phản hồi" : ", có phản hồi"));
    $("connText").textContent = dev.name || "Đã kết nối";
    renderAll();
    try { S.wake = await navigator.wakeLock.request("screen"); } catch (e) {}
    await new Promise(r => setTimeout(r, 250));
    const r = await S.link.status().catch(() => null);
    if (!r) setMsg("Đã kết nối BLE nhưng mạch chưa trả lời. Kiểm tra dây PA5/PB1, nguồn và module BLE (9600).", "err");
    else await refreshList(false);
  } catch (e) {
    S.connected = false; S.connecting = false;
    try { S.dev && S.dev.gatt && S.dev.gatt.connected && S.dev.gatt.disconnect(); } catch (x) {}
    $("connText").textContent = "Không kết nối"; renderAll();
    const name = e && e.name;
    if (name === "NotFoundError") setMsg("Chưa chọn thiết bị nào.", "");
    else if (name === "SecurityError" || name === "NotAllowedError") { setMsg("Trình duyệt không cho trang này dùng Bluetooth. Mở trang trong Chrome (Android) hoặc Bluefy (iPhone), không mở trong khung nhúng.", "err"); log(String(e)); }
    else { setMsg((name ? name + ": " : "") + (e && e.message ? e.message : String(e)), "err"); log(String(e)); }
  }
}
function onDisc() {
  endAllRepeat();
  const was = S.connected;
  S.connected = false; S.connecting = false; S.link = null; S.mode = -1; S.sending = false; S.syncing = false; S.verified = false;
  try { S.wake && S.wake.release(); } catch (e) {}
  $("connText").textContent = "Không kết nối";
  if (was) setMsg("Mất kết nối với module BLE. Bấm nút Bluetooth để nối lại.", "err");
  log("Mất kết nối BLE"); $("prog").hidden = true; renderAll();
}
$("btnConn").addEventListener("click", () => {
  if (S.connected) { const d = S.dev; S.dev = null; try { d.gatt.disconnect(); } catch (e) {} onDisc(); setMsg(""); return; }
  if (!S.connecting) connect();
});

/* ---------- Phím điều khiển ---------- */
const repeaters = [];
function endAllRepeat() { repeaters.forEach(f => f()); }
function press(k, drop) {
  if (!S.connected || S.sending || !S.link) return;
  S.link.key(k, drop).then(r => {
    if (!r) return;
    if (r.status === 1) setMsg(unpackStatus(r.extra).mode === 3 ? "Mạch đang bận nhận/xoá file." : "Mạch chưa có dữ liệu file. Bấm THÊM BÀI hoặc nạp bằng máy tính.", "err");
    else if (r.status === 0 && $("msg").classList.contains("err")) setMsg("");
  });
}
function bindKey(id, key, repeat) {
  const b = $(id); let t1 = null, t2 = null;
  const end = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = null; };
  if (repeat) repeaters.push(end);
  b.addEventListener("pointerdown", e => {
    if (b.disabled) return;
    e.preventDefault();
    try { b.setPointerCapture(e.pointerId); } catch (x) {}
    press(key, false);
    if (repeat) { end(); t1 = setTimeout(() => { t2 = setInterval(() => press(key, true), 100); }, 500); }
  });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach(n => b.addEventListener(n, end));
  b.addEventListener("click", e => { if (e.detail === 0 && !b.disabled) press(key, false); });   // bàn phím (Enter/Space)
  b.addEventListener("contextmenu", e => e.preventDefault());
}
bindKey("kToi", KEY.TOI, true); bindKey("kLui", KEY.LUI, true);
bindKey("kTang", KEY.TANG, false); bindKey("kGiam", KEY.GIAM, false); bindKey("kSS", KEY.SS, false);
document.addEventListener("visibilitychange", () => { if (document.hidden) endAllRepeat(); });

/* ---------- Cài đặt ---------- */
$("btnSet").addEventListener("click", () => { $("sheet").hidden = false; });
$("btnClose").addEventListener("click", () => { $("sheet").hidden = true; });
$("sheet").addEventListener("click", e => { if (e.target === $("sheet")) $("sheet").hidden = true; });
for (const id of ["uuidSvc", "uuidRx", "uuidTx", "chunk"]) {
  const el = $(id), v = ls(id);
  if (v) el.value = v;
  el.addEventListener("change", () => ls(id, el.value.trim()));
}

/* ---------- Khởi động ---------- */
(async function init() {
  const saved = await kvGet("list");
  if (saved && Array.isArray(saved.files)) {
    S.files = saved.files.filter(f => f && typeof f.name === "string").map(f => ({ name: f.name, lines: f.lines || 0 }));
    S.sig = saved.sig === undefined ? null : saved.sig; S.pages = saved.pages || 0; S.cap = saved.cap || 144;
  }
  renderAll();
  if (!navigator.bluetooth) setMsg(noBluetoothMsg(), "err");
})();
</script>
